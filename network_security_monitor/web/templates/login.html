<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · SentinelNet</title><link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}"></head><body class="login-body"><section class="panel login-panel"><a class="brand" href="/login"><span class="shield">S</span> SentinelNet</a><h1>Sign in to your workspace</h1><p>Use the account provisioned by your administrator.</p>{% if error %}<p role="alert" class="critical-text">{{ error }}</p>{% endif %}<form method="post" action="/login"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username<input name="username" autocomplete="username" required maxlength="128"></label><label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label><button type="submit">Sign in →</button></form></section></body></html>
